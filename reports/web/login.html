<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · СКУД Gate</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f2c200'/><path d='M8 22V10h4l4 6 4-6h4v12h-3.4v-6.6L16.4 21h-.8L11.4 15.4V22z' fill='%2312325c'/></svg>">
<style>
:root{--bg:#f1f2f4;--panel:#fbfbfc;--line:#dcdfe4;--line2:#eaecf0;--text:#15181c;--gold:#f2c200;
      --muted:#4e5560;--accent:#2b62d9;--accent2:#1d4ed8;--red:#c0342a;--accent-soft:rgba(43,98,217,.12);--accent-line:rgba(43,98,217,.35);--err-bg:#fdeceb;--err-line:#f5c6c2;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
  color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.box{width:min(360px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:26px 28px 22px;box-shadow:0 2px 10px rgba(16,24,40,.08)}
.logo{width:40px;height:40px;border-radius:7px;display:grid;place-items:center;margin:0 auto 14px;
  background:linear-gradient(160deg,#ffdb4d,var(--gold));box-shadow:inset 0 0 0 1px rgba(18,50,92,.10)}
.logo svg{width:22px;height:22px}
h1{font-size:15px;margin:0 0 3px;text-align:center;font-weight:600}
p.sub{margin:0 0 20px;text-align:center;color:var(--muted);font-size:11.5px}
label{display:block;color:#4a5560;font-size:11.5px;margin:0 0 4px}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:0 11px;height:34px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{margin-bottom:12px}
button{width:100%;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--accent-line);
  border-radius:8px;padding:0;height:34px;color:var(--accent);background:var(--accent-soft);margin-top:6px;transition:.15s}
button:hover{background:rgba(43,98,217,.22);border-color:var(--accent)}
.err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--red);border-radius:8px;
  padding:7px 10px;font-size:12px;margin-bottom:12px}
.foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line2);text-align:center;
  color:#8b95a1;font-size:11px}
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20V6.5A2.5 2.5 0 0 1 6.5 4H12v16H4Z" stroke="#12325c" stroke-width="1.9"/><path d="M12 4h5.5A2.5 2.5 0 0 1 20 6.5V20h-8" stroke="#12325c" stroke-width="1.9" opacity=".65"/><circle cx="9.2" cy="12" r="1.15" fill="#12325c"/></svg></div>
  <h1>СКУД Gate</h1>
  <p class="sub">Мониторинг проходов и отчёты посещаемости</p>
  <div id="err" class="err" style="display:none">Неверный логин или пароль</div>
  <div class="field">
    <label for="username">Пользователь</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
  </div>
  <div class="field">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button type="submit">Войти</button>
  <div class="foot">СКУД Gate-IP</div>
</form>
<script>
if (location.search.indexOf('e=1') >= 0) document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
