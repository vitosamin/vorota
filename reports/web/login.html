<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · СКУД Gate</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%232f6fd0'/><path d='M8 22V10h4l4 6 4-6h4v12h-3.4v-6.6L16.4 21h-.8L11.4 15.4V22z' fill='white'/></svg>">
<style>
:root{--bg:#eef1f5;--panel:#fff;--line:#c9d2dc;--line2:#e3e8ee;--text:#1f2328;
      --muted:#6b7280;--accent:#2f6fd0;--accent2:#2559a8;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
  color:var(--text);font:13px/1.45 "Segoe UI",Tahoma,Verdana,Arial,sans-serif}
.box{width:min(360px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:26px 28px 22px;box-shadow:0 2px 10px rgba(16,24,40,.08)}
.logo{width:38px;height:38px;border-radius:5px;display:grid;place-items:center;margin:0 auto 14px;
  background:var(--accent)}
.logo svg{width:22px;height:22px}
h1{font-size:15px;margin:0 0 3px;text-align:center;font-weight:600}
p.sub{margin:0 0 20px;text-align:center;color:var(--muted);font-size:11.5px}
label{display:block;color:#4a5560;font-size:11.5px;margin:0 0 4px}
input{width:100%;font:inherit;color:var(--text);background:#fff;border:1px solid var(--line);
  border-radius:3px;padding:7px 9px;outline:none;transition:.12s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,111,208,.15)}
.field{margin-bottom:12px}
button{width:100%;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--accent);
  border-radius:3px;padding:8px;color:#fff;background:var(--accent);margin-top:6px;transition:.12s}
button:hover{background:var(--accent2);border-color:var(--accent2)}
.err{background:#fdeceb;border:1px solid #f5c6c2;color:var(--red);border-radius:3px;
  padding:7px 10px;font-size:12px;margin-bottom:12px}
.foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line2);text-align:center;
  color:#8b95a1;font-size:11px}
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20V6.5A2.5 2.5 0 0 1 6.5 4H12v16H4Z" stroke="#fff" stroke-width="1.7"/><path d="M12 4h5.5A2.5 2.5 0 0 1 20 6.5V20h-8" stroke="#fff" stroke-width="1.7" opacity=".7"/><circle cx="9.2" cy="12" r="1.1" fill="#fff"/></svg></div>
  <h1>СКУД Gate</h1>
  <p class="sub">Мониторинг проходов и отчёты посещаемости</p>
  <div id="err" class="err" style="display:none">Неверный логин или пароль</div>
  <div class="field">
    <label for="username">Пользователь</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
  </div>
  <div class="field">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button type="submit">Войти</button>
  <div class="foot">Сервер Gate-IP · 192.168.2.160</div>
</form>
<script>
if (location.search.indexOf('e=1') >= 0) document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
